version: "3.9"

services:
  spandana:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: spandana-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
      - spandana-logs:/var/log/spandana
      - ./backups:/app/backups
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - BACKUP_ROOT=/app/backups

  # Independent recovery control plane. This service is intentionally separate
  # from the Admin Panel so it remains usable when the Admin frontend crashes.
  recovery-console:
    build:
      context: .
      dockerfile: recovery-console.Dockerfile
    container_name: spandana-recovery
    restart: unless-stopped
    ports:
      - "5051:5051"
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/uploads:/app/backend/uploads
      - ./docs:/app/docs
      - ./backups:/app/backups
      - ./.git:/app/.git:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - RECOVERY_PORT=5051
      - RECOVERY_APP_URL=http://spandana:5000
      - BACKUP_ROOT=/app/backups
      - ADMIN_RECOVERY_EMAIL=${ADMIN_RECOVERY_EMAIL:?Set ADMIN_RECOVERY_EMAIL in the deployment environment}
    depends_on:
      - spandana

  # Optional: MongoDB (or use MongoDB Atlas instead)
  # mongodb:
  #   image: mongo:7
  #   container_name: spandana-mongo
  #   restart: unless-stopped
  #   volumes:
  #     - mongo-data:/data/db
  #   environment:
  #     MONGO_INITDB_DATABASE: spandana

  # Nginx reverse proxy (optional if hosting on VPS)
  nginx:
    image: nginx:alpine
    container_name: spandana-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/spandana.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro
    depends_on:
      - spandana

volumes:
  spandana-logs:
  # mongo-data:
